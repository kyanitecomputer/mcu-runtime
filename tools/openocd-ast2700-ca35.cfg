# AST2700 CA35 quad-core via J-Link
source [find interface/jlink.cfg]
transport select jtag

# CA35 TAP — adjust IR length if scan chain fails
# AST2700 CA35 uses standard ARM CoreSight DAP
jtag newtap ast2700 cpu -irlen 4 -expected-id 0x6ba00477

dap create ast2700.dap -chain-position ast2700.cpu

# Core 0 only for now
target create ast2700.cpu0 aarch64 -dap ast2700.dap -ap-num 1 -dbgbase 0x81010000

# Slow clock for initial connection
adapter speed 1000

init

# Don't reset — we want to inspect state after our BootMCU releases CA35
# Just halt whatever core 0 is doing
halt
reg pc
reg cpsr
