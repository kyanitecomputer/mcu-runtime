# ── AST10x0 RoT (ARM Cortex-M4F) ─────────────────────────────────────────────
# Covers AST1030, AST1040, AST1060, AST1080.
[target.thumbv7em-none-eabihf]
runner = "probe-rs run --chip-description-path probe-rs-targets/AST1060.yaml"

rustflags = [
    "-C", "link-arg=-Tlink.x",
    "-C", "link-arg=--nmagic",
]

# ── AST2700 BootMCU (RISC-V ibex RV32IMC) ────────────────────────────────────
[target.riscv32imc-unknown-none-elf]
runner = "false"   # no on-target runner yet; use: cargo build then flash manually

rustflags = [
    "-C", "link-arg=-Tmemory.x",
    "-C", "link-arg=-Tlink.x",
    "-C", "link-arg=--nmagic",
]
