[package]
name        = "app-rot"
version     = "0.1.0"
edition     = "2021"
description = "Embassy-based firmware binaries for ASPEED MCU coprocessors (Root-of-Trust)"
repository  = "https://github.com/kyanitecomputer/aspeed-mcu-runtime"
publish     = false

# ── Firmware binaries ──────────────────────────────────────────────────────────
# AST2600 SSP (Cortex-M3)
[[bin]]
name = "hello_uart"
path = "src/bin/hello_uart.rs"

[[bin]]
name = "blinky"
path = "src/bin/blinky.rs"

[[bin]]
name = "ipc_echo"
path = "src/bin/ipc_echo.rs"

# AST1060 (Cortex-M4F)
[[bin]]
name = "hello_uart_ast1060"
path = "src/bin/hello_uart_ast1060.rs"

[[bin]]
name = "blinky_ast1060"
path = "src/bin/blinky_ast1060.rs"

# AST2700 BootMCU (RV32IMC)
[[bin]]
name = "hello_uart_bootmcu"
path = "src/bin/hello_uart_bootmcu.rs"

[[bin]]
name = "ipc_echo_bootmcu"
path = "src/bin/ipc_echo_bootmcu.rs"

# ── Feature flags ──────────────────────────────────────────────────────────────
[features]
default = ["defmt"]

# Select exactly one chip per build invocation.
ast2600-ssp = [
    "embassy-aspeed/ast2600-ssp",
    "dep:cortex-m",
    "dep:cortex-m-rt",
]
ast1060 = [
    "embassy-aspeed/ast1060",
    "dep:cortex-m",
    "dep:cortex-m-rt",
]
ast2700-bootmcu = [
    "embassy-aspeed/ast2700-bootmcu",
    "dep:riscv",
    "dep:riscv-rt",
]

defmt = ["embassy-aspeed/defmt"]

# ── Dependencies ───────────────────────────────────────────────────────────────
[dependencies]
# Async HAL — relative path dep to aspeed-rs sibling repo.
# Post-push: switch to git = "https://github.com/kyanitecomputer/aspeed-rs", rev = "<sha>"
embassy-aspeed = { path = "../../aspeed-rs/embassy-aspeed" }

embassy-executor = { git = "https://github.com/embassy-rs/embassy", features = ["executor-thread"] }
embassy-time     = { git = "https://github.com/embassy-rs/embassy", features = ["tick-hz-1_000_000"] }

# Chip-specific runtime support (pulled in by feature flags above).
cortex-m    = { version = "0.7", features = ["inline-asm", "critical-section-single-core"], optional = true }
cortex-m-rt = { version = "0.7", optional = true }
riscv    = { version = "0.11", features = ["critical-section-single-hart"], optional = true }
riscv-rt = { version = "0.12", optional = true }

# Embedded HAL traits — needed directly by firmware binaries.
embedded-io       = "0.6"
embedded-io-async = "0.6"

defmt = "0.3"

# defmt-rtt and panic-halt are architecture-specific.
[target.'cfg(target_arch = "arm")'.dependencies]
defmt-rtt  = "0.4"
panic-halt = "0.2"

[target.'cfg(target_arch = "riscv32")'.dependencies]
defmt-rtt  = "0.4"
panic-halt = "0.2"

[profile.release]
debug         = true
opt-level     = "s"
lto           = true
codegen-units = 1
panic         = "abort"

[profile.dev]
debug     = true
opt-level = 1
panic     = "abort"
